# Faz-o-Pix — Full Docker Compose (alternative to dev.sh)
# Ports: backend=63292, frontend=63293, postgres=63294

services:
  postgres:
    image: postgres:14-alpine
    container_name: fazopix-postgres
    environment:
      POSTGRES_DB: fazopix_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "63294:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fazopix_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fazopix-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:dev_password_123@postgres:5432/fazopix_dev
      JWT_SECRET: dev_jwt_secret_min_32_chars_long_123456789
      COOKIE_SECRET: dev_cookie_secret_min_32_chars_long_123456789
      ENCRYPTION_KEY: dev_encryption_key_exactly_32_chars12
      PORT: 63292
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:63293
    ports:
      - "63292:63292"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fazopix-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:63292/api
      NEXT_PUBLIC_WS_URL: ws://localhost:63292
      PORT: 63293
      NODE_ENV: development
    ports:
      - "63293:63293"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npx next dev -p 63293
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
